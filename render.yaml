# Render Blueprint. The existing gmc-presence service must be connected to THIS repo (branch main):
# it was first created from the older youth-innovations-marketplace repo, whose server knows nothing
# about the sailing opening or the commitment wall. Build: npm install. Start: node server/presence.js
# (Free web services sleep; first WebSocket after idle can take ~30–60s.)

services:
  - type: web
    name: gmc-presence
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/presence.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Host token for the sailing opening; see docs/sail-opening-runbook.md
      - key: SAIL_TOKEN
        sync: false
