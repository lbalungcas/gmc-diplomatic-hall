# Netlify Build & Deploy Configuration
# Site: youthinnovationsmarketplace.org

[build]
  # Second step builds the registration app (registration/) into dist/register/.
  command = "npm install && npm run build && npm ci --prefix registration && npm run build:site --prefix registration"
  publish = "dist"

# Ensure /game/ route serves game/index.html on direct access or refresh
[[redirects]]
  from = "/game"
  to = "/game/index.html"
  status = 200

[[redirects]]
  from = "/game/"
  to = "/game/index.html"
  status = 200

# The sailing opening: phones at /sail/, the LED at /sail/?view=led
[[redirects]]
  from = "/sail"
  to = "/sail/index.html"
  status = 200

[[redirects]]
  from = "/sail/"
  to = "/sail/index.html"
  status = 200

# The live commitment wall: phones at /commit/, the big screen at /commit/?view=wall
[[redirects]]
  from = "/commit"
  to = "/commit/index.html"
  status = 200

[[redirects]]
  from = "/commit/"
  to = "/commit/index.html"
  status = 200

# YIM Feedback & Resources (unlinked; shared by QR code)
[[redirects]]
  from = "/resources"
  to = "/resources/index.html"
  status = 200

[[redirects]]
  from = "/resources/"
  to = "/resources/index.html"
  status = 200

# Redirect old /innovator-guidelines/ route to home
[[redirects]]
  from = "/innovator-guidelines"
  to = "/"
  status = 301

[[redirects]]
  from = "/innovator-guidelines/*"
  to = "/"
  status = 301

# Admin dashboard (hidden — no public links)
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

# Registration app (registration/): public form at /register, staff pages at /register/admin.
# Its routes are client-side, so anything under /register that isn't a file serves its index.html.
[[redirects]]
  from = "/register"
  to = "/register/"
  status = 301

[[redirects]]
  from = "/register/*"
  to = "/register/index.html"
  status = 200

# Proxy admin API calls to the presence server
[[redirects]]
  from = "/admin-api/*"
  to = "https://gmc-presence.onrender.com/admin-api/:splat"
  status = 200
  force = true

# Headers for performance & security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Keep the registration staff pages out of search engines.
[[headers]]
  for = "/register/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/register/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/landing/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
