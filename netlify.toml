# Netlify Build & Deploy Configuration
# Site: youthinnovationsmarketplace.org

[build]
  command = "npm install && npm run build"
  publish = "dist"

# Ensure /game/ route serves game/index.html on direct access or refresh
[[redirects]]
  from = "/game"
  to = "/game/index.html"
  status = 200

[[redirects]]
  from = "/game/"
  to = "/game/index.html"
  status = 200

# Headers for performance & security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/landing/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
