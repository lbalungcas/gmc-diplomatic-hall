# Netlify Build & Deploy Configuration
# Site: youthinnovationsmarketplace.org

[build]
  command = "npm install && npm run build"
  publish = "dist"

# Ensure /game/ route serves game/index.html on direct access or refresh
[[redirects]]
  from = "/game"
  to = "/game/index.html"
  status = 200

[[redirects]]
  from = "/game/"
  to = "/game/index.html"
  status = 200

# Ensure /innovator-guidelines/ route serves innovator-guidelines/index.html
[[redirects]]
  from = "/innovator-guidelines"
  to = "/innovator-guidelines/index.html"
  status = 200

[[redirects]]
  from = "/innovator-guidelines/"
  to = "/innovator-guidelines/index.html"
  status = 200

# Admin dashboard (hidden — no public links)
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

# Proxy admin API calls to the presence server
[[redirects]]
  from = "/admin-api/*"
  to = "https://gmc-presence.onrender.com/admin-api/:splat"
  status = 200
  force = true

# Headers for performance & security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/landing/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
